<!-- Keep title and favicon in one line, so the github actions remove them correctly -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />
  <title><%= apTitle %></title>

  <!-- Primary Meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="FlowForge is a modern open-source workflow automation platform for building, automating, and managing workflows through a powerful visual no-code editor." />
  <meta name="keywords"
    content="FlowForge, workflow automation, no-code automation, workflow builder, open source, automation platform, integrations" />
  <meta name="author" content="FlowForge" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="theme-color" content="#10B981" />
  <meta name="color-scheme" content="dark light" />

  <!-- Canonical -->
  <link rel="canonical" href="https://flowforge.app" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png" />
  <link rel="icon" type="image/x-icon" href="<%= apFavicon %>" />

  <!-- Web App -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FlowForge" />
  <meta property="og:title" content="FlowForge" />
  <meta property="og:description"
    content="Build. Automate. Scale. Create powerful workflow automations with FlowForge." />
  <meta property="og:url" content="https://flowforge.app" />
  <meta property="og:image" content="https://flowforge.app/og-image.png" />
  <meta property="og:image:secure_url" content="https://flowforge.app/og-image.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="FlowForge - Open Source Workflow Automation Platform" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FlowForge" />
  <meta name="twitter:description"
    content="Build. Automate. Scale. Create powerful workflow automations with FlowForge." />
  <meta name="twitter:image" content="https://flowforge.app/og-image.png" />
  <meta name="twitter:image:alt" content="FlowForge Workflow Automation Platform" />

  <!-- Mobile -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FlowForge" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="/src/styles.css" />

  <!-- Structured Data -->
  <script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"SoftwareApplication",
  "name":"FlowForge",
  "applicationCategory":"BusinessApplication",
  "operatingSystem":"Web",
  "url":"https://flowforge.app",
  "image":"https://flowforge.app/og-image.png",
  "description":"FlowForge is an open-source workflow automation platform that enables teams to build, automate, and manage workflows using a modern visual no-code editor.",
  "publisher":{
    "@type":"Organization",
    "name":"FlowForge"
  }
}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
